<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EM-STAT | MASTROWALL</title>
    <link
      rel="icon"
      href="https://cdn.jsdelivr.net/gh/ItsEsd/mastrowall-com@824e862529a56e6c81512e2a5a0a0c8852ff0779/images/favicon-logos/adminlogo.png"
      type="image/png"
      sizes="16x16"
    />
    <style>
      * {
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #1e293b;
      }

      .container {
        max-width: 1200px;
        width: 100%;
        padding: 32px 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 40px;
      }

      .image-box img {
        width: 100%;
        max-width: 560px;
        display: block;
        margin: auto;
      }

      .content {
        text-align: left;
      }

      .content h1 {
        font-size: clamp(2.2rem, 5vw, 3.5rem);
        margin: 0 0 12px;
        font-weight: 800;
        color: #2b1e3d;
      }

      .content p {
        font-size: 1.05rem;
        color: #475569;
        max-width: 460px;
        line-height: 1.6;
      }

      .badge {
        display: inline-block;
        background: #eef2ff;
        color: #4f46e5;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 14px;
      }

      footer {
        padding: 20px;
        font-size: 0.85rem;
        color: #94a3b8;
        text-align: center;
      }

      /* ---------- RESPONSIVE ---------- */
      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .content {
          text-align: center;
        }

        .content p {
          margin: auto;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <!-- IMAGE -->
      <div class="image-box">
        <!-- Use your local image path if hosted -->
        <img src="/img/coming-soon.svg" alt="Coming Soon Illustration" />
      </div>

      <!-- CONTENT -->
      <div class="content">
        <span class="badge">We’re building something great</span>
        <h1>Coming Soon</h1>
        <p>
          Our platform is currently under development. We’re working behind the
          scenes to deliver a powerful, seamless, and enterprise-ready
          experience.
        </p>
        <a target="_self" href="/" style="margin-top: 20px; display: block"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            height="30px"
            viewBox="0 -960 960 960"
            width="30px"
            fill="#141414"
          >
            <path
              d="m287-446.67 240 240L480-160 160-480l320-320 47 46.67-240 240h513v66.66H287Z"
            />
          </svg>
        </a>
      </div>
    </main>

    <footer>© <span id="year"></span> MASTROWALL. All rights reserved.</footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
