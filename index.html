<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - MASTROWALL</title>
    <link
      rel="icon"
      href="https://cdn.jsdelivr.net/gh/ItsEsd/mastrowall-com@824e862529a56e6c81512e2a5a0a0c8852ff0779/images/favicon-logos/adminlogo.png"
      type="image/png"
      sizes="16x16"
    />
    <link rel="stylesheet" href="css/new-style.css" />
  </head>

  <body>
    <!-- HERO -->
    <section class="hero">
      <img src="/images/mwalllogo.png" />
      <h1>An Art of Learning | AMRIT EdTech</h1>
      <h3>Centralized Platform Operations</h3>
    </section>

    <!-- BUTTONS -->
    <main class="container">
      <div class="grid">
        <div class="card" onclick="openLink('/media-edit/')">
          <div class="overlay blue">Telemedia Edit</div>
        </div>

        <div class="card" onclick="openLink('/admin-tools/')">
          <div class="overlay green">Admin Tools</div>
        </div>

        <div
          class="card"
          onclick="
            openLink(
              'https://enterprise.amrit-corp.com/em-stat/?unit=dealtodealers&ref=admin',
            )
          "
        >
          <div class="overlay orange">EM-STAT</div>
        </div>

        <div
          class="card"
          onclick="openLink('https://enterprise.amrit-corp.com/')"
        >
          <div class="overlay purple">Enterprise</div>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>© <span id="year"></span> MASTROWALL. All rights reserved.</footer>

    <script>
      function openLink(url) {
        window.location.href = url; // opens in self
      }

      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
